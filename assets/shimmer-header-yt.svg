<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 14" width="100%" height="14" preserveAspectRatio="none">
  <defs>
    <linearGradient id="waveRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF0000" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="shimmerRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.3)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
    <style>
      .shimmer-red {
        animation: shimmerRedMove 2.5s ease-in-out infinite;
      }
      @keyframes shimmerRedMove {
        0%   { transform: translateX(-1200px); }
        100% { transform: translateX(1200px); }
      }
    </style>
  </defs>
  <path d="M0,0 L1200,0 L1200,8 Q900,16 600,8 Q300,1 0,8 Z" fill="url(#waveRedGrad)" />
  <rect class="shimmer-red" x="0" y="0" width="600" height="14" fill="url(#shimmerRedGrad)" opacity="0.7" />
</svg>
