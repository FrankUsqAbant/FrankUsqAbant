<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 25" width="100%" height="20">
  <defs>
    <style>
      .role-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 14px;
        font-style: italic;
        font-weight: 500;
        text-anchor: middle;
        letter-spacing: 0.5px;
        animation: neonBreathe 3.5s ease-in-out infinite;
      }
      @keyframes neonBreathe {
        0%, 100% {
          opacity: 0.3;
          fill: #8b949e;
          filter: drop-shadow(0 0 0px transparent);
        }
        50% {
          opacity: 1;
          fill: #00d8ff;
          filter: drop-shadow(0 0 6px rgba(0, 216, 255, 0.85));
        }
      }
    </style>
  </defs>
  <text class="role-text" x="50%" y="68%">Software Engineer &#160;·&#160; Frontend Specialist &#160;·&#160; AI Content Creator</text>
</svg>
