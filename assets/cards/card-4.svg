<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 310" width="100%" height="100%">
  <defs>
    <linearGradient id="shimmerLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d8ff" />
      <stop offset="50%" stop-color="#bd34fe" />
      <stop offset="100%" stop-color="#00d8ff" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <clipPath id="clipImg-card-4">
      <rect x="16" y="52" width="248" height="175" rx="8" />
    </clipPath>

    <style>
      .card-bg {
        fill: #0d1117;
        stroke: #000000;
        stroke-width: 2.5;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        fill: #e6edf3;
        font-size: 14.5px;
      }
      .desc-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11.5px;
        fill: #8b949e;
        line-height: 1.5;
      }
    </style>
  </defs>

  <!-- Marco Base Negro -->
  <rect x="4" y="4" width="272" height="302" rx="14" class="card-bg" filter="url(#cardShadow)" />
  
  <!-- Barra Shimmer Superior -->
  <rect x="5" y="5" width="270" height="4" rx="2" fill="url(#shimmerLine)" />

  <!-- Título del Proyecto -->
  <text x="140" y="34" class="title-text" text-anchor="middle">Developer Theme Portfolio</text>

  <!-- Imagen del Proyecto -->
  <rect x="16" y="52" width="248" height="175" rx="8" fill="#090d13" stroke="#21262d" stroke-width="1" />
  <image href="data:image/jpeg;base64," x="16" y="52" width="248" height="175" preserveAspectRatio="xMidYMid slice" clip-path="url(#clipImg-card-4)" />

  <!-- Pequeño Resumen Descriptivo -->
  <text class="desc-text">
    <tspan x="140" y="250" text-anchor="middle">Proyecto de desarrollo web moderno</tspan><tspan x="140" y="269" text-anchor="middle">y de alto rendimiento.</tspan>
  </text>
</svg>