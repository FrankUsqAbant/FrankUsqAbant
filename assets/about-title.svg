<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 32" width="180" height="28">
  <defs>
    <style>
      .dev-anim {
        animation: devPulse 2.2s ease-in-out infinite alternate;
        transform-origin: 12px 18px;
        display: inline-block;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 20px;
        font-weight: 700;
        fill: #e6edf3;
      }
      @keyframes devPulse {
        0%   { transform: translateY(0px) rotate(0deg) scale(1); }
        100% { transform: translateY(-2px) rotate(-3deg) scale(1.05); }
      }
    </style>
  </defs>
  <text class="dev-anim" x="0" y="24" font-size="22">👨‍💻</text>
  <text class="title-text" x="35" y="24">Sobre Mí</text>
</svg>
