<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 35" width="100%" height="35" preserveAspectRatio="none">
  <defs>
    <linearGradient id="footerGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00d8ff" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="shimmerFooter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.25)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
    <style>
      .shimmer-footer {
        animation: shimmerFooterMove 3s ease-in-out infinite;
      }
      @keyframes shimmerFooterMove {
        0%   { transform: translateX(-1200px); }
        100% { transform: translateX(1200px); }
      }
    </style>
  </defs>
  <path d="M0,35 L1200,35 L1200,24 Q900,14 600,24 Q300,34 0,24 Z" fill="url(#footerGrad)" />
  <rect class="shimmer-footer" x="0" y="10" width="600" height="25" fill="url(#shimmerFooter)" opacity="0.6" />
</svg>
