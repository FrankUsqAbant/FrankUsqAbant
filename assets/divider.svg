<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 3" width="100%" height="3" preserveAspectRatio="none">
  <defs>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#00d8ff" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <style>
      .glow-divider {
        animation: glowPulse 3s ease-in-out infinite;
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.5; }
        50%      { opacity: 1; }
      }
    </style>
  </defs>
  <rect class="glow-divider" x="0" y="0" width="1200" height="3" rx="1.5" fill="url(#glowLine)" />
</svg>
